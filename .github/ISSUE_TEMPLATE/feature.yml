name: Feature Request
description: Suggest a new feature or improvement
labels: ["feature-request", "pending-triage"]
assignees: []

body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting an improvement! Help us understand what you'd like to see.

  - type: textarea
    id: description
    attributes:
      label: Feature Description
      description: What feature would you like to see added?
      placeholder: |
        I would like to have [feature] so that [benefit].
    validations:
      required: true

  - type: textarea
    id: use_case
    attributes:
      label: Use Case
      description: Why do you need this feature? What problem does it solve?
      placeholder: |
        Currently, when I [current workflow], it's [current limitation].
        With [feature], I could [improved workflow].
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution (Optional)
      description: How do you think this should be implemented?
      placeholder: |
        This could be done by:
        1. [approach 1]
        2. [approach 2]

  - type: textarea
    id: examples
    attributes:
      label: Examples
      description: Real-world examples or mockups of the feature
      placeholder: Show us how this would look or work

  - type: dropdown
    id: priority
    attributes:
      label: Priority
      description: How important is this feature to you?
      options:
        - Low
        - Medium
        - High
        - Critical

  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Any other relevant information?
      placeholder: Links, screenshots, references, etc.

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I've searched existing issues and didn't find a duplicate
          required: true
        - label: I've described the problem this solves clearly
          required: true
