name: Bug Report
description: Report a bug or unexpected behavior
labels: ["bug", "pending-triage"]
assignees: []

body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please provide as much detail as possible.

  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened? Describe the bug clearly.
      placeholder: |
        When I try to [action], [unexpected behavior] occurs instead of [expected behavior].
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What should happen instead?
      placeholder: The app should [expected behavior]
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: How can we reproduce this bug?
      placeholder: |
        1. Go to [page/feature]
        2. Click on [button]
        3. Enter [data]
        4. Bug occurs at [point]
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating System
      options:
        - macOS
        - Windows
        - Linux
        - iOS
        - Android
        - Other
    validations:
      required: false

  - type: input
    id: python_version
    attributes:
      label: Python Version (if applicable)
      description: What Python version are you using?
      placeholder: "3.13"
    validations:
      required: false

  - type: input
    id: browser
    attributes:
      label: Browser (if frontend issue)
      description: Which browser and version?
      placeholder: "Chrome 120, Firefox 121, etc."
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Error Logs / Stack Trace
      description: Paste any error messages or stack traces
      render: python

  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Any other relevant information?
      placeholder: Add screenshots, environment details, etc.

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I've searched existing issues and didn't find a duplicate
          required: true
        - label: I've included all relevant details and logs
          required: true
