name: Deploy

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Fly CLI
      uses: superfly/flyctl-actions/setup-flyctl@master
    
    - name: Deploy to Fly.io
      run: flyctl deploy --remote-only
      env:
        FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      continue-on-error: true
    
    # Uncomment below for Render.com deployment
    # - name: Deploy to Render
    #   run: |
    #     curl https://api.render.com/deploy/srv-${{ secrets.RENDER_SERVICE_ID }}?key=${{ secrets.RENDER_DEPLOY_KEY }} -d ""
    #   continue-on-error: true

  notify-success:
    needs: deploy
    runs-on: ubuntu-latest
    if: success()
    
    steps:
    - name: Deployment successful
      run: echo "✅ Deployment to production completed successfully"

  notify-failure:
    needs: deploy
    runs-on: ubuntu-latest
    if: failure()
    
    steps:
    - name: Deployment failed
      run: echo "❌ Deployment failed. Check logs for details"
