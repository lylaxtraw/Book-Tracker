# Fly.io deployment. Rename app to something unique before `fly launch --no-deploy`.
app = "cherrystraw-bookmark"
primary_region = "qro"   # Querétaro -- nearest region to Veracruz

[build]
  dockerfile = "Dockerfile"

[env]
  SECURE_COOKIES = "true"
  DATABASE_URL = "sqlite:////data/booktracker.db"

# The library lives here. Without this the database is wiped on every deploy.
[[mounts]]
  source = "bookmark_data"
  destination = "/data"

[http_service]
  internal_port = 8000
  force_https = true
  # Keep one machine warm so the app opens instantly on the phone.
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
