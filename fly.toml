# Fly.io deployment for Book Tracker
app = "boocker"
primary_region = "dfw"   # Dallas, Texas -- best for Mexico

[build]
  dockerfile = "Dockerfile"

[env]
  SECURE_COOKIES = "true"

# The library lives here. Without this the database is wiped on every deploy.
[[mounts]]
  source = "data"
  destination = "/data"

[http_service]
  internal_port = 8000
  force_https = true
  # Keep one machine warm so the app opens instantly on the phone.
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
